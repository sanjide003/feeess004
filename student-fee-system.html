                                            </div>
                                            {m.id !== student.id && (
                                                <button onClick={() => removeCandidate(m.id)} className="text-red-500 hover:text-red-700 text-xs">
                                                    <i className="fas fa-trash"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Add More Siblings Picker */}
                            <div className="border-t border-slate-200 pt-3">
                                <label className="block text-xs font-bold text-slate-600 mb-1.5">Search & Add Other Siblings</label>
                                <div className="grid grid-cols-2 gap-2 mb-2">
                                    <input
                                        type="text"
                                        placeholder="Search by name..."
                                        value={searchName}
                                        onChange={e => setSearchName(e.target.value)}
                                        className="p-2 border border-slate-200 rounded-lg text-xs outline-none"
                                    />
                                    <input
                                        type="text"
                                        placeholder="Class filter (e.g. 5)"
                                        value={searchCls}
                                        onChange={e => setSearchCls(e.target.value)}
                                        className="p-2 border border-slate-200 rounded-lg text-xs outline-none"
                                    />
                                </div>

                                {searchName && (
                                    <div className="max-h-36 overflow-y-auto border border-amber-200 rounded-lg bg-amber-50/50 divide-y divide-amber-100">
                                        {availableCandidates.length === 0 ? (
                                            <div className="p-2 text-center text-xs text-slate-400">No matching students found</div>
                                        ) : (
                                            availableCandidates.slice(0, 8).map(cand => (
                                                <div key={cand.id} className="p-2 flex items-center justify-between text-xs hover:bg-amber-100/50">
                                                    <div>
                                                        <span className="font-bold text-slate-800">{cand.name}</span>
                                                        <span className="text-[10px] text-slate-500 ml-1.5">Class {cand.studentClass} • Adm: {cand.adm || '-'}</span>
                                                    </div>
                                                    <button onClick={() => addCandidate(cand)} className="px-2 py-0.5 bg-amber-600 text-white font-bold rounded text-[10px] hover:bg-amber-700">
                                                        Add
                                                    </button>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="bg-slate-50 px-5 py-3 border-t border-slate-200 flex justify-end gap-2 shrink-0">
                            <button onClick={onClose} className="px-4 py-2 border border-slate-200 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-100 transition">
                                Cancel
                            </button>
                            <button onClick={handleSave} disabled={saving} className="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold shadow transition">
                                {saving ? 'Saving...' : 'Save Group Setup'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- DASHBOARD OVERVIEW TAB ---
        const DashboardTab = ({ students, studentGroups, payments, settings, dynamicMonths, CLASSES, academicYear }) => {
            const stats = useMemo(() => {
                const totalStudents = students.length;
                const boys = students.filter(s => s.gender === 'M').length;
                const girls = students.filter(s => s.gender === 'F').length;

                const yearPayments = payments.filter(p => !academicYear || !p.academicYear || p.academicYear === academicYear);
                const totalCollected = yearPayments.reduce((sum, p) => sum + Number(p.amount || 0), 0);

                const classStats = CLASSES.map(cls => {
                    const clsStudents = students.filter(s => s.studentClass === cls);
                    const clsBoys = clsStudents.filter(s => s.gender === 'M').length;
                    const clsGirls = clsStudents.filter(s => s.gender === 'F').length;
                    const clsCollected = yearPayments.filter(p => clsStudents.some(s => s.id === p.studentId)).reduce((sum, p) => sum + Number(p.amount || 0), 0);
                    return { cls, count: clsStudents.length, boys: clsBoys, girls: clsGirls, collected: clsCollected };
                }).filter(r => r.count > 0);

                return { totalStudents, boys, girls, totalCollected, classStats };
            }, [students, payments, CLASSES, academicYear]);

            return (
                <div className="space-y-5">
                    <div className="bg-gradient-to-r from-blue-700 to-indigo-700 text-white p-6 rounded-2xl shadow-md flex items-center justify-between">
                        <div>
                            <h2 className="text-2xl font-black mb-1">Executive Fee Dashboard</h2>
                            <p className="text-blue-100 text-xs font-medium">Institution collection metrics and student demographic strength</p>
                        </div>
                        {academicYear && (
                            <span className="bg-white/20 px-3 py-1.5 rounded-full text-xs font-bold backdrop-blur-sm">
                                Academic Year: {academicYear}
                            </span>
                        )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white border border-slate-200 p-4 rounded-xl shadow-sm">
                            <span className="text-xs font-bold text-slate-400 uppercase">Enrolled Students</span>
                            <div className="text-3xl font-black text-slate-800 mt-1">{stats.totalStudents}</div>
                            <div className="text-xs text-slate-500 font-semibold mt-1">Boys: {stats.boys} • Girls: {stats.girls}</div>
                        </div>

                        <div className="bg-white border border-emerald-200 bg-emerald-50/30 p-4 rounded-xl shadow-sm">
                            <span className="text-xs font-bold text-emerald-700 uppercase">Total Collected</span>
                            <div className="text-3xl font-black text-emerald-800 mt-1">{formatCurrency(stats.totalCollected)}</div>
                            <div className="text-xs text-emerald-600 font-semibold mt-1">Through current session</div>
                        </div>

                        <div className="bg-white border border-amber-200 bg-amber-50/30 p-4 rounded-xl shadow-sm">
                            <span className="text-xs font-bold text-amber-700 uppercase">Fee Groups</span>
                            <div className="text-3xl font-black text-amber-800 mt-1">{studentGroups.length}</div>
                            <div className="text-xs text-amber-600 font-semibold mt-1">Active sibling concession groups</div>
                        </div>

                        <div className="bg-white border border-indigo-200 bg-indigo-50/30 p-4 rounded-xl shadow-sm">
                            <span className="text-xs font-bold text-indigo-700 uppercase">Active Classes</span>
                            <div className="text-3xl font-black text-indigo-800 mt-1">{stats.classStats.length}</div>
                            <div className="text-xs text-indigo-600 font-semibold mt-1">Configured divisions</div>
                        </div>
                    </div>

                    {/* Class-wise Breakdown Table */}
                    <div className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden p-5">
                        <h3 className="font-extrabold text-slate-800 text-sm mb-3">Class-wise Strength & Collection</h3>
                        <div className="overflow-x-auto">
                            <table className="w-full text-xs text-left border-collapse">
                                <thead className="bg-slate-100 font-bold text-slate-600 uppercase text-[10px]">
                                    <tr>
                                        <th className="p-2.5 border-b">Class</th>
                                        <th className="p-2.5 border-b text-center">Total Students</th>
                                        <th className="p-2.5 border-b text-center">Boys</th>
                                        <th className="p-2.5 border-b text-center">Girls</th>
                                        <th className="p-2.5 border-b text-right">Fee Collected</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {stats.classStats.map(r => (
                                        <tr key={r.cls} className="hover:bg-slate-50">
                                            <td className="p-2.5 font-bold text-slate-800">Class {r.cls}</td>
                                            <td className="p-2.5 text-center font-bold text-slate-700">{r.count}</td>
                                            <td className="p-2.5 text-center text-blue-600 font-bold">{r.boys}</td>
                                            <td className="p-2.5 text-center text-pink-600 font-bold">{r.girls}</td>
                                            <td className="p-2.5 text-right font-black text-emerald-700">{formatCurrency(r.collected)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        // --- FEE PAYMENT HISTORY TAB ---
        const FeeHistoryTab = ({ students, payments, dynamicMonths, showAlert }) => {
            const [historySearch, setHistorySearch] = useState('');

            const historyRows = useMemo(() => {
                const map = new Map(students.map(s => [s.id, s]));
                let list = payments.map(p => {
                    const st = map.get(p.studentId);
                    return {
                        id: p.id,
                        receipt: p.receiptNo || '-',
                        date: p.paymentDate || '-',
                        studentName: st ? st.name : (p.studentId || 'Unknown'),
                        studentClass: st ? st.studentClass : (p.classLabel || '-'),
                        item: p.description || p.itemKey || 'Monthly Fee',
                        amount: Number(p.amount || 0),
                        collectedBy: p.collectedByName || 'Cashier',
                        timestamp: p.timestamp || 0
                    };
                });

                if (historySearch.trim()) {
                    const q = historySearch.trim().toLowerCase();
                    list = list.filter(r =>
                        r.receipt.toLowerCase().includes(q) ||
                        r.studentName.toLowerCase().includes(q) ||
                        r.item.toLowerCase().includes(q)
                    );
                }

                list.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                return list;
            }, [students, payments, historySearch]);

            return (
                <div className="space-y-4">
                    <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-3">
                        <div>
                            <h2 className="text-base font-extrabold text-slate-800 leading-tight">Payment Audit & Receipt History</h2>
                            <p className="text-xs text-slate-500 font-medium">All logged transactions recorded in database</p>
                        </div>
                        <input
                            type="text"
                            placeholder="Search receipt, student..."
                            value={historySearch}
                            onChange={e => setHistorySearch(e.target.value)}
                            className="px-3 py-1.5 text-xs border border-slate-200 rounded-lg outline-none w-full sm:w-64"
                        />
                    </div>

                    <div className="table-container border border-slate-200 rounded-xl bg-white shadow-sm">
                        <table className="w-full text-xs text-left border-collapse">
                            <thead className="bg-slate-100 font-bold text-slate-600 uppercase text-[10px] sticky top-0">
                                <tr>
                                    <th className="p-3 border-b">Date</th>
                                    <th className="p-3 border-b">Receipt #</th>
                                    <th className="p-3 border-b">Student</th>
                                    <th className="p-3 border-b text-center">Class</th>
                                    <th className="p-3 border-b">Fee Item</th>
                                    <th className="p-3 border-b text-right">Amount</th>
                                    <th className="p-3 border-b text-center">Collector</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {historyRows.length === 0 ? (
                                    <tr>
                                        <td colSpan="7" className="p-8 text-center text-slate-400 font-semibold">
                                            No payment records found.
                                        </td>
                                    </tr>
                                ) : (
                                    historyRows.map(row => (
                                        <tr key={row.id} className="hover:bg-slate-50">
                                            <td className="p-3 font-semibold text-slate-700">{row.date}</td>
                                            <td className="p-3 font-mono font-bold text-blue-700">{row.receipt}</td>
                                            <td className="p-3 font-bold text-slate-800">{row.studentName}</td>
                                            <td className="p-3 text-center font-bold text-slate-600">{row.studentClass}</td>
                                            <td className="p-3 text-slate-600">{row.item}</td>
                                            <td className="p-3 text-right font-black text-emerald-700">{formatCurrency(row.amount)}</td>
                                            <td className="p-3 text-center text-slate-500 font-medium">{row.collectedBy}</td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
